name: gamevui-asset-studio
services:
  preview:
    build: .
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  node_modules:
